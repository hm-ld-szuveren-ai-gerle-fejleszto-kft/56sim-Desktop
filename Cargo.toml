[workspace]
resolver = "2"
members = ["crates/sim-core", "crates/marchgen", "crates/audiocpp-sys", "crates/sim-app"]

[workspace.package]
version = "1956.10.23"
edition = "2021"
rust-version = "1.92"

[workspace.dependencies]
sim-core = { path = "crates/sim-core" }
marchgen = { path = "crates/marchgen" }
audiocpp-sys = { path = "crates/audiocpp-sys" }

rusqlite = { version = "0.41", features = ["bundled", "backup"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_chacha = "0.3"
sha2 = "0.10"
# ureq 2: no default features ("tls" is rustls-backed in ureq 2; native-tls/OpenSSL never enabled)
ureq = { version = "2", default-features = false, features = ["tls"] }
dirs = "5"
libc = "0.2"
libloading = "0.8"
toml = "0.8"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
regex = "1"
unicode-normalization = "0.1"
tempfile = "3"

gtk4 = { version = "0.11", features = ["v4_10"] }
libadwaita = { version = "0.9", features = ["v1_6"] }
glib = "0.20"
rodio = "0.23"
cpal = "0.18"
sndio = "0.1"
llama-cpp-2 = "0.1"
